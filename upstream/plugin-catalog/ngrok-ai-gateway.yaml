name: ngrok-ai-gateway
repo: https://github.com/ngrok/hermes-ngrok
subdir: model-providers/ngrok
# Release step: replace with the full (quoted) SHA of the release commit on ngrok/hermes-ngrok.
sha: "0000000000000000000000000000000000000000"
description: "The ngrok AI Gateway (ngrok.ai) as a Hermes model provider — one access key for every model provider, with failover and key rotation. Live model list from your gateway, an identifying User-Agent on every request, and gateway errors (unrouted model, access-policy and upstream-key failures, out of credit) mapped onto Hermes recovery. Disclosure — sends model requests and the model-list probe to https://gateway.ngrok.ai/v1 (or NGROK_AI_GATEWAY_BASE_URL) with your access key; no other network calls, files or background processes."
maintainer: ngrok
tier: community
category: models
requires_hermes: ">=0.21.6"
docs_url: https://github.com/ngrok/hermes-ngrok#readme
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - NGROK_AI_GATEWAY_KEY
